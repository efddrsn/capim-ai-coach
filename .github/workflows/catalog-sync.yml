name: Catalog sync

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC — runs daily-cadence sources
    - cron: "0 7 * * 1"   # weekly Monday 07:00 UTC — runs weekly-cadence sources
  workflow_dispatch:
    inputs:
      cadence:
        description: "Cadence filter (daily | weekly | empty for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no writes to Notion)"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Determine cadence
        id: cad
        run: |
          if [ -n "${{ github.event.inputs.cadence }}" ]; then
            echo "value=${{ github.event.inputs.cadence }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 7 * * 1" ]; then
            echo "value=weekly" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "value=daily" >> $GITHUB_OUTPUT
          else
            echo "value=" >> $GITHUB_OUTPUT
          fi

      - name: Run sync
        env:
          CADENCE: ${{ steps.cad.outputs.value }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run sync:dry-run
          else
            npm run sync
          fi
